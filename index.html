<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Calculator EMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: radial-gradient(circle at top, #1d4ed8, #111827 45%, #030712);
      color: #fff;
      min-height: 100vh;
      padding: 30px;
    }
    .container { max-width: 1200px; margin: auto; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 46px; font-weight: 700; }
    .header p { color: #cbd5e1; margin-top: 8px; }
    .card {
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(15px);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 { margin-bottom: 12px; color: #93c5fd; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
    input, select, textarea {
      width: 100%; padding: 13px; border: none; outline: none; border-radius: 12px;
      background: #1f2937; color: white; font-size: 14px;
    }
    input::placeholder { color: #9ca3af; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    .result-box {
      margin-top: 16px; background: #111827; border-radius: 14px; padding: 16px;
    }
    .result-box h3 { margin-bottom: 10px; font-size: 16px; }
    #medicineList { display: flex; flex-direction: column; gap: 8px; }
    .medicine { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 10px; background: #1f2937; }
    .medicine-block { background: #1f2937; border-radius: 10px; padding: 10px; }
    .medicine-block h4 { margin-bottom: 6px; color: #93c5fd; font-size: 14px; }
    .disease-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .total { margin-top: 10px; font-size: 22px; font-weight: 700; color: #4ade80; }
    .summary-strip { margin-top: 6px; font-size: 14px; color: #cbd5e1; }
    .actions { margin-top: 25px; display: flex; flex-wrap: wrap; gap: 12px; }
    button {
      padding: 13px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; transition: .2s;
    }
    button:hover { transform: translateY(-2px); }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-dark { background: #374151; color: white; }
    textarea { margin-top: 12px; height: 180px; background: #0f172a; color: white; resize: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #334155; padding: 10px; text-align: left; font-size: 13px; }
    th { background: #1f2937; }
    @media (max-width: 768px) {
      .header h1 { font-size: 34px; }
      .actions { flex-direction: column; }
      button { width: 100%; }
      .disease-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏥 Medical Calculator EMS</h1>
      <p>Pendataan Penanganan Medis Pasien</p>
    </div>

    <div class="card">
      <h2>👨‍⚕️ Data Pegawai Medis</h2>
      <div class="grid">
        <div>
          <label>Nama Pegawai</label>
          <input type="text" id="pegawai" placeholder="Nama Pegawai" />
        </div>
        <div>
          <label>Jabatan</label>
          <input type="text" id="jabatan" placeholder="Dokter / Paramedis" />
        </div>
        <div>
          <label>Badge ID</label>
          <input type="text" id="badge" placeholder="EMS-001" />
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🧑 Data Pasien</h2>
      <div class="grid">
        <div>
          <label>Nama Pasien</label>
          <input type="text" id="pasien" placeholder="Nama Pasien" />
        </div>
        <div>
          <label>Nomor Telepon</label>
          <input type="text" id="telepon" placeholder="08xxxxxxxxxx" />
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🩺 Diagnosis</h2>
      <div id="diseaseRows"></div>
      <div class="actions">
        <button class="btn-primary" type="button" onclick="addDiseaseRow()">+ Tambah Penyakit</button>
      </div>
    </div>

    <div class="result-box">
      <div class="card">

      <h3>Daftar Penyakit & Obat</h3>
      <div id="medicineList">Belum ada penyakit dipilih.</div>
      <div class="total" id="totalPrice">Total : $0</div>
      <div class="summary-strip" id="medicineCountSummary">Total obat keluar: 0 item</div>
      <textarea id="hasil" readonly placeholder="Ringkasan tindakan medis akan muncul di sini..."></textarea>

      <div class="actions">
        <button class="btn-success" onclick="window.print()">Print</button>
        <button class="btn-danger" onclick="resetForm()">Reset</button>
        <button class="btn-dark" onclick="sendDiscord()">Discord</button>
      </div>
    </div>
  </div>

  <script>
    const diseases = {
  "Water Aspiration": [
    { name: "Medical Kit", qty: "1 pcs", price: 15 },
    { name: "Cyclonamine", qty: "1 pcs", price: 5 }
  ],

  "Massive Trauma": [
    { name: "Blood Bag (500ml)", qty: "1 Kantong", price: 5 },
    { name: "Suture Kit", qty: "1 Set", price: 5 },
    { name: "Morphine", qty: "2 Ampul / Tablet", price: 30 }
  ],

  "Road Rash": [
    { name: "Disinfectant", qty: "1 pcs", price: 5 },
    { name: "Bandage", qty: "2 pcs", price: 30 }
  ],

  "Massive Trauma Leg": [
    { name: "Suture Kit", qty: "1 Set", price: 5 }
  ],

  "Bruise": [
    { name: "Ointment", qty: "1 Tub", price: 5 }
  ],

  "Spinal Injury": [
    { name: "Bandage", qty: "3 pcs", price: 45 },
    { name: "Blood Bag (500ml)", qty: "1 Kantong", price: 5 },
    { name: "Suture Kit", qty: "2 Set", price: 10 },
    { name: "Morphine", qty: "2 Ampul / Tablet", price: 30 },
    { name: "Advanced Medical Kit", qty: "1 pcs", price: 15 }
  ],

  "Broken Arm": [
    { name: "Bandage", qty: "3 pcs", price: 45 },
    { name: "Splint", qty: "1 pcs", price: 5 },
    { name: "Advanced Medical Kit", qty: "1 pcs", price: 15 }
  ],

  "Broken Ribs": [
    { name: "Bandage", qty: "3 pcs", price: 45 },
    { name: "Splint", qty: "1 pcs", price: 5 },
    { name: "Advanced Medical Kit", qty: "2 pcs", price: 30 }
  ],

  "Multiple Fracture": [
    { name: "Bandage", qty: "1 pcs", price: 15 },
    { name: "Splint", qty: "1 pcs", price: 5 },
    { name: "Advanced Medical Kit", qty: "2 pcs", price: 30 }
  ],

  "Scraped Knee": [
    { name: "Bandage", qty: "1 pcs", price: 15 },
    { name: "Disinfectant", qty: "2 pcs", price: 10 }
  ]
    };

    const diseaseRows = document.getElementById("diseaseRows");
    const medicineList = document.getElementById("medicineList");
    const totalPrice = document.getElementById("totalPrice");
    const hasil = document.getElementById("hasil");
    const historyTableBody = document.querySelector("#historyTable tbody");
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1532693247439274055/H231GnPYOmwaMDxecverHjIsVhrhFrOL9Nk3N_HMwCLa8qmg3KQJf_Bzly5Cm_1qJOmE";

    function createDiseaseRow(selectedValue = "") {
      const row = document.createElement("div");
      row.className = "disease-row";
      row.innerHTML = `
        <select class="disease-select">
          <option value="">-- Pilih Penyakit --</option>
          ${Object.keys(diseases).map((disease) => `<option value="${disease}" ${selectedValue === disease ? "selected" : ""}>${disease}</option>`).join("")}
        </select>
        <button class="btn-danger" type="button" onclick="removeDiseaseRow(this)">Hapus</button>
      `;
      row.querySelector("select").addEventListener("change", renderSummary);
      return row;
    }

    function addDiseaseRow(selectedValue = "") {
      diseaseRows.appendChild(createDiseaseRow(selectedValue));
      renderSummary();
    }

    function removeDiseaseRow(button) {
      const row = button.closest(".disease-row");
      if (row) {
        row.remove();
        renderSummary();
      }
    }

    function collectSelectedDiseases() {
      return Array.from(diseaseRows.querySelectorAll(".disease-row"))
        .map((row) => row.querySelector(".disease-select").value)
        .filter(Boolean);
    }

    function renderSummary() {
      const selectedDiseases = collectSelectedDiseases();
      medicineList.innerHTML = "";
      hasil.value = "";
      totalPrice.textContent = "Total : $0";
      document.getElementById("medicineCountSummary").textContent = "Total obat keluar: 0 item";

      if (!selectedDiseases.length) {
        medicineList.innerHTML = "Belum ada penyakit dipilih.";
        return;
      }

      let total = 0;
      let totalItems = 0;
      let report = "===== DATA MEDIS =====\n\n";
      report += "Daftar penyakit yang dipilih :\n";

      selectedDiseases.forEach((disease, index) => {
        const items = diseases[disease];
        report += `${index + 1}. ${disease}\n`;
        medicineList.innerHTML += `
          <div class="medicine-block">
            <h4>${index + 1}. ${disease}</h4>
        `;

        items.forEach((item) => {
          total += item.price;
          totalItems += parseInt(item.qty) || 1;
          medicineList.innerHTML += `
            <div class="medicine">
              <div>
                <b>${item.name}</b><br>
                <small>${item.qty}</small>
              </div>
              <div>$${item.price}</div>
            </div>
          `;
          report += `• ${item.qty} ${item.name} ($${item.price})\n`;
        });

        medicineList.innerHTML += `</div>`;
        report += "\n";
      });

      report += "\n--------------------------------\n";
      report += `TOTAL OBAT KELUAR : ${totalItems} item\n`;
      report += `TOTAL BIAYA : $${total}`;

      totalPrice.textContent = `Total : $${total}`;
      document.getElementById("medicineCountSummary").textContent = `Total obat keluar: ${totalItems} item`;
      hasil.value = report;
    }

    function copyResult() {
      navigator.clipboard.writeText(document.getElementById("hasil").value);
      alert("Berhasil disalin.");
    }

    function resetForm() {
      document.getElementById("pegawai").value = "";
      document.getElementById("jabatan").value = "";
      document.getElementById("badge").value = "";
      document.getElementById("pasien").value = "";
      document.getElementById("telepon").value = "";
      diseaseRows.innerHTML = "";
      addDiseaseRow();
      renderSummary();
    }

    function loadHistory() {
      const saved = JSON.parse(localStorage.getItem("medicalHistory") || "[]");
      historyTableBody.innerHTML = "";

      if (!saved.length) {
        historyTableBody.innerHTML = '<tr><td colspan="6">Belum ada riwayat.</td></tr>';
        return;
      }

      saved.forEach((record) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${record.no}</td>
          <td>${record.date}</td>
          <td>${record.pegawai}</td>
          <td>${record.pasien}</td>
          <td>${record.diagnosis}</td>
          <td>${record.total}</td>
        `;
        historyTableBody.appendChild(row);
      });
    }

    function saveHistoryEntry(selectedDiseases, total) {
      const saved = JSON.parse(localStorage.getItem("medicalHistory") || "[]");
      const record = {
        no: saved.length + 1,
        date: new Date().toLocaleString("id-ID"),
        pegawai: document.getElementById("pegawai").value || "-",
        pasien: document.getElementById("pasien").value || "-",
        diagnosis: selectedDiseases.join(", "),
        total: `$${total}`
      };

      saved.unshift(record);
      localStorage.setItem("medicalHistory", JSON.stringify(saved.slice(0, 10)));
      loadHistory();
    }

    async function sendDiscord() {
      const selectedDiseases = collectSelectedDiseases();
      if (!selectedDiseases.length) {
        alert("Pilih penyakit terlebih dahulu.");
        return;
      }

      const pegawai = document.getElementById("pegawai").value || "-";
      const jabatan = document.getElementById("jabatan").value || "-";
      const badge = document.getElementById("badge").value || "-";
      const pasien = document.getElementById("pasien").value || "-";
      const telepon = document.getElementById("telepon").value || "-";
      const total = document.getElementById("totalPrice").innerText;

      let daftarObat = "";
      let totalHarga = 0;

      selectedDiseases.forEach((disease) => {
        daftarObat += `🩺 **${disease}**\n`;
        diseases[disease].forEach((item) => {
          totalHarga += item.price;
          daftarObat += `• ${item.qty} ${item.name} - $${item.price}\n`;
        });
        daftarObat += "\n";
      });

      const tanggal = new Date().toLocaleString("id-ID");
      const payload = {
        username: "🏥 EMS Medical Calculator",
        avatar_url: "https://i.imgur.com/8Km9tLL.png",
        embeds: [{
          title: "📋 LAPORAN PENANGANAN MEDIS",
          description: "Pendataan tindakan medis berhasil dibuat.",
          color: 3447003,
          thumbnail: { url: "https://i.imgur.com/8Km9tLL.png" },
          fields: [
            { name: "👨‍⚕️ DATA PEGAWAI", value: `**Nama**\n${pegawai}\n\n**Jabatan**\n${jabatan}\n\n**Badge**\n${badge}`, inline: true },
            { name: "🧑 DATA PASIEN", value: `**Nama**\n${pasien}\n\n**Telepon**\n${telepon}`, inline: true },
            { name: "🩺 DIAGNOSIS", value: selectedDiseases.join("\n"), inline: false },
            { name: "💉 PENANGANAN / OBAT", value: daftarObat, inline: false },
            { name: "💰 TOTAL BIAYA", value: "```" + total + "```", inline: true },
            { name: "📅 WAKTU PENANGANAN", value: tanggal, inline: true }
          ],
          footer: { text: "EMS Medical Calculator • RK Medical System" },
          timestamp: new Date().toISOString()
        }]
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          saveHistoryEntry(selectedDiseases, totalHarga);
          alert("✅ Berhasil dikirim ke Discord dan tercatat.");
        } else {
          alert("❌ Gagal mengirim ke Discord.");
        }
      } catch (error) {
        console.error(error);
        alert("Terjadi kesalahan.");
      }
    }

    document.getElementById("pegawai").addEventListener("input", renderSummary);
    document.getElementById("jabatan").addEventListener("input", renderSummary);
    document.getElementById("badge").addEventListener("input", renderSummary);
    document.getElementById("pasien").addEventListener("input", renderSummary);
    document.getElementById("telepon").addEventListener("input", renderSummary);

    addDiseaseRow();
    loadHistory();
    renderSummary();
  </script>
</body>
</html>
